version: "3.9"

# ─────────────────────────────────────────────────────────────────
# CarRental – Production Docker Compose (AWS ECR images)
# Usage:
#   export ECR_REGISTRY=<account>.dkr.ecr.us-east-1.amazonaws.com
#   export IMAGE_TAG=latest   # or a commit SHA
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  # ──────────────────────────────────────────────
  # Server – Node / Express / Prisma  (ECR image)
  # ──────────────────────────────────────────────
  server:
    image: ${ECR_REGISTRY}/car-rental-server:${IMAGE_TAG:-latest}
    container_name: car_rental_server_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # CloudWatch logging via awslogs driver (see logging section)
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/car-rental-server
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: server
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ──────────────────────────────────────────────
  # Client – Nginx serving React build (ECR image)
  # ──────────────────────────────────────────────
  client:
    image: ${ECR_REGISTRY}/car-rental-client:${IMAGE_TAG:-latest}
    container_name: car_rental_client_prod
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/car-rental-client
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: client
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 128M

# No local volumes in prod – state is in RDS / S3 / ImageKit
