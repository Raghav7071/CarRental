version: "3.9"

# ─────────────────────────────────────────────────────────────────
# CarRental – Local Development Docker Compose
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────

services:
  # ──────────────────────────────────────────────
  # PostgreSQL – local development database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: car_rental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrental_dev}
      POSTGRES_DB: ${POSTGRES_DB:-carrental_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrental} -d ${POSTGRES_DB:-carrental_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Server – Node / Express / Prisma
  # ──────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: car_rental_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-carrental}:${POSTGRES_PASSWORD:-carrental_dev}@db:5432/${POSTGRES_DB:-carrental_db}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "5000:5000"
    volumes:
      # Live-reload: mount source code but exclude node_modules
      - ./server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────
  # Client – React / Vite (dev server)
  # ──────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev          # lightweight dev image (see below)
    container_name: car_rental_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  db_data:
    driver: local
