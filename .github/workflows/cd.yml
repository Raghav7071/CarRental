name: CD – Build, Push to ECR & Deploy to ECS

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO_CLIENT: car-rental-client
  ECR_REPO_SERVER: car-rental-server
  ECS_CLUSTER: car-rental-cluster
  ECS_SERVICE_CLIENT: car-rental-client-service
  ECS_SERVICE_SERVER: car-rental-server-service
  ECS_TASK_DEF_CLIENT: car-rental-client-task
  ECS_TASK_DEF_SERVER: car-rental-server-task
  CONTAINER_NAME_CLIENT: car-rental-client
  CONTAINER_NAME_SERVER: car-rental-server

jobs:
  # ────────────────────────────────────────────────
  # 1. Build & Push Client image → ECR
  # ────────────────────────────────────────────────
  build-push-client:
    name: "Client – Build & Push to ECR"
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag and push client image to ECR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        id: output-image
        run: echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────
  # 2. Build & Push Server image → ECR
  # ────────────────────────────────────────────────
  build-push-server:
    name: "Server – Build & Push to ECR"
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.output-image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag and push server image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        id: output-image
        run: echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────
  # 3. Deploy Client → ECS (Fargate)
  # ────────────────────────────────────────────────
  deploy-client:
    name: "Client – Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: [build-push-client]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current ECS task definition (client)
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEF_CLIENT }} \
            --query taskDefinition \
            --output json > task-def-client.json

      - name: Update ECS task definition with new client image
        id: task-def-client
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-client.json
          container-name: ${{ env.CONTAINER_NAME_CLIENT }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:${{ github.sha }}

      - name: Register and deploy new client task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-client.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_CLIENT }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ────────────────────────────────────────────────
  # 4. Deploy Server → ECS (Fargate)
  # ────────────────────────────────────────────────
  deploy-server:
    name: "Server – Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: [build-push-server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current ECS task definition (server)
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEF_SERVER }} \
            --query taskDefinition \
            --output json > task-def-server.json

      - name: Update ECS task definition with new server image
        id: task-def-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-server.json
          container-name: ${{ env.CONTAINER_NAME_SERVER }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:${{ github.sha }}

      - name: Register and deploy new server task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-server.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_SERVER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
